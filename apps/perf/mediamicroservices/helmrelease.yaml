apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-microservices
  namespace: mediamicroservices
spec:
  # Paused 2026-03-14 for the EKS 1.31 upgrade. TODO resume after the vpc-cni
  # network policy rollout.
  suspend: true
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: ./mediaMicroservices/helm-chart/mediamicroservices
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: deathstarbench
        namespace: flux-system
  install:
    remediation:
      retries: 3
  values:
    global:
      dockerRegistry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
      defaultImageVersion: "2024-05-05"
      replicas: 2
