apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-thrift
  namespace: socialnetwork
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/6d1c2f0e-6c7b-4b8e-9a43-2f1d9a7e5b10
    alb.ingress.kubernetes.io/inbound-cidrs: 172.20.0.0/14
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - host: social.perf.corp.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-thrift
                port:
                  number: 8080
